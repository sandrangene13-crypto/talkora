<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b5b">
  <title>TAVLIK</title>

  <style>
    :root {
      --primary: #176b5b;
      --primary-dark: #0f5145;
      --accent: #31b58c;
      --background: #f4f7f6;
      --surface: #ffffff;
      --surface-2: #eef3f1;
      --text: #17201e;
      --muted: #6f7d79;
      --border: #dce5e1;
      --danger: #d64545;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    body.dark {
      --background: #101715;
      --surface: #17211e;
      --surface-2: #202c28;
      --text: #edf5f2;
      --muted: #9baaa5;
      --border: #30403a;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       AUTH
    ===================================================== */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, rgba(49, 181, 140, 0.22), transparent 35%),
        var(--background);
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      color: var(--primary);
      font-size: 38px;
      letter-spacing: 2px;
    }

    .brand p {
      color: var(--muted);
      margin-top: 6px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .auth-tab {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--muted);
      font-weight: bold;
    }

    .auth-tab.active {
      background: var(--primary);
      color: white;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .primary-btn {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      margin-top: 5px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .auth-error {
      color: var(--danger);
      font-size: 14px;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* =====================================================
       MAIN APP
    ===================================================== */

    .app {
      width: 100%;
      height: 100vh;
      display: none;
    }

    .app.logged-in {
      display: flex;
    }

    .sidebar {
      width: 370px;
      height: 100%;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .sidebar-brand {
      font-size: 25px;
      font-weight: bold;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .icon-btn:hover {
      background: var(--border);
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
    }

    .user-item {
      padding: 13px 17px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .user-item:hover,
    .user-item.active {
      background: var(--surface-2);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-users {
      text-align: center;
      color: var(--muted);
      padding: 35px 20px;
      line-height: 1.5;
    }

    /* =====================================================
       CHAT
    ===================================================== */

    .chat {
      flex: 1;
      height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--background);
    }

    .chat-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 25px;
    }

    .chat-empty h2 {
      color: var(--text);
      margin-bottom: 8px;
    }

    .chat-header {
      height: 70px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      display: none;
    }

    .chat-user {
      flex: 1;
      min-width: 0;
    }

    .chat-user-name {
      font-weight: bold;
      font-size: 17px;
    }

    .chat-user-status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: min(75%, 600px);
      padding: 10px 13px;
      border-radius: 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .message-row.mine .message-bubble {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      border-bottom-right-radius: 4px;
    }

    .message-row:not(.mine) .message-bubble {
      border-bottom-left-radius: 4px;
    }

    .message-image {
      max-width: 280px;
      max-height: 350px;
      border-radius: 10px;
      display: block;
    }

    .voice-player {
      width: 250px;
      max-width: 100%;
    }

    .message-time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      opacity: 0.7;
      text-align: right;
    }

    .typing {
      height: 24px;
      padding: 0 18px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px;
    }

    .composer-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .composer-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 22px;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
    }

    .composer-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 18px;
    }

    .recording {
      background: var(--danger) !important;
    }

    .image-preview {
      padding: 10px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .image-preview.show {
      display: flex;
    }

    .image-preview img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
    }

    .preview-name {
      flex: 1;
      color: var(--muted);
      font-size: 13px;
    }

    /* =====================================================
       PROFILE MODAL
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 18px;
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin: 0 auto 18px;
    }

    .profile-info {
      text-align: center;
      line-height: 1.8;
    }

    .logout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--danger);
      color: white;
      font-weight: bold;
    }

    /* =====================================================
       CALL UI
    ===================================================== */

    .call-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .call-overlay.show {
      display: flex;
    }

    .call-title {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .call-status {
      color: #c9d5d1;
      margin-bottom: 20px;
    }

    #remoteVideo {
      width: min(900px, 95vw);
      max-height: 65vh;
      background: #000;
      border-radius: 15px;
      object-fit: contain;
    }

    #localVideo {
      position: fixed;
      right: 25px;
      bottom: 100px;
      width: 180px;
      max-width: 30vw;
      border-radius: 12px;
      background: #000;
      border: 2px solid white;
    }

    .call-actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .call-action {
      min-width: 110px;
      border: none;
      border-radius: 25px;
      padding: 12px 18px;
      color: white;
      font-weight: bold;
    }

    .accept-call {
      background: var(--accent);
    }

    .reject-call,
    .end-call {
      background: var(--danger);
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(100px);
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      z-index: 3000;
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .chat {
        position: fixed;
        inset: 0;
        z-index: 20;
        transform: translateX(100%);
        transition: transform 0.2s ease;
      }

      .app.chat-open .chat {
        transform: translateX(0);
      }

      .app.chat-open .sidebar {
        display: none;
      }

      .back-btn {
        display: inline-flex;
      }

      .message-bubble {
        max-width: 85%;
      }

      #localVideo {
        right: 12px;
        bottom: 90px;
        width: 130px;
      }

      .auth-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       AUTH SCREEN
  ====================================================== -->

  <section id="authScreen" class="auth-screen">
    <div class="auth-card">

      <div class="brand">
        <h1>TAVLIK</h1>
        <p>Private messaging made simple</p>
      </div>

      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active" type="button">
          Login
        </button>

        <button id="registerTab" class="auth-tab" type="button">
          Register
        </button>
      </div>

      <div id="authError" class="auth-error"></div>

      <!-- LOGIN -->

      <form id="loginForm">
        <div class="form-group">
          <label for="loginIdentifier">Username or Email</label>
          <input
            id="loginIdentifier"
            type="text"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="primary-btn" type="submit">
          Login
        </button>
      </form>

      <!-- REGISTER -->

      <form id="registerForm" class="hidden">
        <div class="form-group">
          <label for="registerUsername">Username</label>
          <input
            id="registerUsername"
            type="text"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button class="primary-btn" type="submit">
          Create Account
        </button>
      </form>

    </div>
  </section>


  <!-- =====================================================
       MAIN APP
  ====================================================== -->

  <section id="app" class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="sidebar-top">
          <div class="sidebar-brand">TAVLIK</div>

          <div class="header-actions">
            <button
              id="themeButton"
              class="icon-btn"
              type="button"
              title="Toggle theme"
            >
              ◐
            </button>

            <button
              id="profileButton"
              class="icon-btn"
              type="button"
              title="Profile"
            >
              ●
            </button>
          </div>
        </div>

        <div class="search-box">
          <input
            id="searchInput"
            type="search"
            placeholder="Search username..."
            autocomplete="off"
          >
        </div>

      </div>

      <div id="userList" class="user-list">
        <div class="empty-users">
          Search for a username to start a private conversation.
        </div>
      </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

      <div id="chatEmpty" class="chat-empty">
        <div>
          <h2>Welcome to TAVLIK</h2>
          <p>Select a person to start a private conversation.</p>
        </div>
      </div>

      <div id="chatContent" class="hidden" style="height:100%;display:flex;flex-direction:column;">

        <header class="chat-header">

          <button
            id="backButton"
            class="icon-btn back-btn"
            type="button"
          >
            ←
          </button>

          <div id="chatAvatar" class="avatar">
            ?
          </div>

          <div class="chat-user">
            <div id="chatUserName" class="chat-user-name">
              User
            </div>

            <div id="chatUserStatus" class="chat-user-status">
              Private conversation
            </div>
          </div>

          <button
            id="videoCallButton"
            class="icon-btn"
            type="button"
            title="Video call"
          >
            ▣
          </button>

        </header>


        <div id="messages" class="messages"></div>

        <div id="typingIndicator" class="typing"></div>


        <div class="composer">

          <div id="imagePreview" class="image-preview">
            <img id="previewImage" alt="Selected image">
            <div id="previewName" class="preview-name"></div>

            <button
              id="cancelImageButton"
              class="icon-btn"
              type="button"
            >
              ×
            </button>
          </div>

          <div class="composer-row">

            <input
              id="messageInput"
              class="composer-input"
              type="text"
              maxlength="2000"
              placeholder="Type a message..."
              autocomplete="off"
            >

            <input
              id="imageInput"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
              class="hidden"
            >

            <button
              id="imageButton"
              class="icon-btn"
              type="button"
              title="Send photo"
            >
              ▧
            </button>

            <button
              id="voiceButton"
              class="icon-btn"
              type="button"
              title="Record voice"
            >
              🎙
            </button>

            <button
              id="sendButton"
              class="send-btn"
              type="button"
              title="Send"
            >
              ➤
            </button>

          </div>

        </div>

      </div>

    </main>

  </section>


  <!-- =====================================================
       PROFILE MODAL
  ====================================================== -->

  <div id="profileModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">
        <h2>My Profile</h2>

        <button
          id="closeProfileButton"
          class="icon-btn"
          type="button"
        >
          ×
        </button>
      </div>

      <div id="profileAvatar" class="profile-avatar">
        ?
      </div>

      <div class="profile-info">
        <div>
          <strong>Username:</strong>
          <span id="profileUsername"></span>
        </div>

        <div>
          <strong>Email:</strong>
          <span id="profileEmail"></span>
        </div>
      </div>

      <button
        id="logoutButton"
        class="logout-btn"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>


  <!-- =====================================================
       INCOMING CALL
  ====================================================== -->

  <div id="incomingCall" class="call-overlay">

    <div class="call-title">
      Incoming video call
    </div>

    <div id="incomingCallerName" class="call-status">
      Someone is calling...
    </div>

    <div class="call-actions">

      <button
        id="acceptCallButton"
        class="call-action accept-call"
        type="button"
      >
        Accept
      </button>

      <button
        id="rejectCallButton"
        class="call-action reject-call"
        type="button"
      >
        Reject
      </button>

    </div>

  </div>


  <!-- =====================================================
       ACTIVE CALL
  ====================================================== -->

  <div id="callScreen" class="call-overlay">

    <div id="callTitle" class="call-title">
      Video call
    </div>

    <div id="callStatus" class="call-status">
      Connecting...
    </div>

    <video
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div class="call-actions">

      <button
        id="endCallButton"
        class="call-action end-call"
        type="button"
      >
        End call
      </button>

    </div>

  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div id="toast" class="toast"></div>


  <!-- =====================================================
       SOCKET.IO
  ====================================================== -->

  <script src="/socket.io/socket.io.js"></script>

  <script>
    "use strict";

    /* =====================================================
       STATE
    ===================================================== */

    const TOKEN_KEY = "tavlik_token";

    let token = localStorage.getItem(TOKEN_KEY);
    let currentUser = null;
    let socket = null;

    let selectedUser = null;
    let users = [];

    let typingTimer = null;
    let isTyping = false;

    let selectedImageData = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    let localStream = null;
    let peerConnection = null;

    let incomingCallerId = null;
    let incomingCallerName = "";
    let incomingOffer = null;

    const peerConfig = {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    };


    /* =====================================================
       DOM
    ===================================================== */

    const authScreen = document.getElementById("authScreen");
    const app = document.getElementById("app");

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const authError = document.getElementById("authError");

    const loginIdentifier = document.getElementById("loginIdentifier");
    const loginPassword = document.getElementById("loginPassword");

    const registerUsername = document.getElementById("registerUsername");
    const registerEmail = document.getElementById("registerEmail");
    const registerPassword = document.getElementById("registerPassword");

    const searchInput = document.getElementById("searchInput");
    const userList = document.getElementById("userList");

    const chatEmpty = document.getElementById("chatEmpty");
    const chatContent = document.getElementById("chatContent");

    const backButton = document.getElementById("backButton");

    const chatAvatar = document.getElementById("chatAvatar");
    const chatUserName = document.getElementById("chatUserName");
    const chatUserStatus = document.getElementById("chatUserStatus");

    const messagesContainer = document.getElementById("messages");

    /* =====================================================
       HELPERS
    ===================================================== */

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function showAuthError(message) {
      authError.textContent = message || "";
    }

    function getInitial(username) {
      if (!username) return "?";
      return username.charAt(0).toUpperCase();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(dateString) {
      const date = new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    async function api(url, options = {}) {
      const headers = {
        ...(options.headers || {})
      };

      if (!(options.body instanceof FormData)) {
        headers["Content-Type"] = "application/json";
      }

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const response = await fetch(url, {
        ...options,
        headers
      });

      let data = {};

      try {
        data = await response.json();
      } catch {
        data = {};
      }

      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }

      return data;
    }

    /* =====================================================
       START APP
    ===================================================== */

    async function startApp() {
      try {
        const data = await api("/api/me");

        currentUser = data.user;

        authScreen.classList.add("hidden");
        app.classList.add("logged-in");

        authScreen.classList.remove("hidden");
        app.classList.remove("logged-in");

        showAuthError("Your session has expired. Please log in again.");
      }

    /* =====================================================
       SOCKET CONNECTION
    ===================================================== */

    function connectSocket() {
      if (socket) {
        socket.disconnect();
      }

      socket = io({
        auth: {
          token
        }
      });

      socket.on("connect", () => {
        console.log("Connected to TAVLIK server.");
      });

      socket.on("connect_error", (error) => {
        console.error("Socket connection error:", error.message);

        if (error.message.toLowerCase().includes("authentication")) {
          logout();
        }
      });

      socket.on("new_message", (message) => {
        handleIncomingMessage(message);
      });

      socket.on("user_typing", ({ userId }) => {
        if (
          selectedUser &&
          Number(selectedUser.id) === Number(userId)
        ) {
          typingIndicator.textContent = `${selectedUser.username} is typing...`;
        }
      });

      socket.on("user_stopped_typing", ({ userId }) => {
        if (
          selectedUser &&
          Number(selectedUser.id) === Number(userId)
        ) {
          typingIndicator.textContent = "";
        }
      });

      socket.on("incoming_call", (payload) => {
        handleIncomingCall(payload);
      });

      socket.on("call_accepted", async (payload) => {
        await handleCallAccepted(payload);
      });

      socket.on("ice_candidate", async (payload) => {
        await handleIceCandidate(payload);
      });

      socket.on("call_rejected", () => {
        callStatus.textContent = "Call rejected.";
        setTimeout(closeCallScreen, 1500);
      });

      socket.on("end_call", () => {
        closeCallScreen();
      });
    }

    async function searchUsers(query) {
      if (!query) {
        users = [];

        userList.innerHTML = `
          <div class="empty-users">
            Search for a username to start a private conversation.
          </div>
        `;

        return;
      }

      try {
        const data = await api(
          `/api/users/search?q=${encodeURIComponent(query)}`
        );

        users = data.users || [];

        renderUsers();
      } catch (error) {
        userList.innerHTML = `
          <div class="empty-users">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function renderUsers() {
      if (!users.length) {
        userList.innerHTML = `
          <div class="empty-users">
            No users found.
          </div>
        `;

        return;
      }

      userList.innerHTML = "";

      users.forEach((user) => {
        const item = document.createElement("div");

        item.className = "user-item";

        if (
          selectedUser &&
          Number(selectedUser.id) === Number(user.id)
        ) {
          item.classList.add("active");
        }

        item.innerHTML = `
          <div class="avatar">
            ${escapeHtml(getInitial(user.username))}
          </div>

          <div class="user-info">
            <div class="user-name">
              ${escapeHtml(user.username)}
            </div>

            <div class="user-subtitle">
              Private conversation
            </div>
          </div>
        `;

        item.addEventListener("click", () => {
          openChat(user);
        });

        userList.appendChild(item);
      });
    }


    /* =====================================================
       OPEN PRIVATE CHAT
    ===================================================== */

    async function openChat(user) {
      if (!user || !user.id) {
        return;
      }

      selectedUser = {
        id: Number(user.id),
        username: user.username,
        email: user.email || ""
      };

      chatEmpty.classList.add("hidden");
      chatContent.classList.remove("hidden");

      chatContent.style.display = "flex";

      chatAvatar.textContent = getInitial(selectedUser.username);
      chatUserName.textContent = selectedUser.username;
      chatUserStatus.textContent = "Private conversation";

      messagesContainer.innerHTML = `
        <div class="empty-users">
          Loading messages...
        </div>
      `;

      typingIndicator.textContent = "";

      renderUsers();

      app.classList.add("chat-open");

      try {
        const data = await api(
          `/api/messages/${encodeURIComponent(selectedUser.id)}`
        );

        /*
          Only render messages belonging to this exact conversation.
        */

        const safeMessages = (data.messages || []).filter((message) => {
          const sender = Number(message.sender_id);
          const receiver = Number(message.receiver_id);
          const other = Number(selectedUser.id);
          const me = Number(currentUser.id);

          return (
            (sender === me && receiver === other) ||
            (sender === other && receiver === me)
          );
        });

        renderMessages(safeMessages);
      } catch (error) {
        messagesContainer.innerHTML = `
          <div class="empty-users">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }


    /* =====================================================
       RENDER MESSAGES
    ===================================================== */

    function renderMessages(messages) {
      messagesContainer.innerHTML = "";

      if (!messages.length) {
        messagesContainer.innerHTML = `
          <div class="empty-users">
            No messages yet. Say hello!
          </div>
        `;

        return;
      }

      messages.forEach((message) => {
        renderMessage(message, false);
      });

      scrollMessages();
    }

    function renderMessage(message, scroll = true) {
      if (!selectedUser || !currentUser) {
        return;
      }

      const senderId = Number(message.sender_id);
      const receiverId = Number(message.receiver_id);

      const me = Number(currentUser.id);
      const other = Number(selectedUser.id);

      /*
        Extra client-side protection:
        never render a message from an unrelated conversation.
      */

      const belongsToConversation =
        (senderId === me && receiverId === other) ||
        (senderId === other && receiverId === me);

      if (!belongsToConversation) {
        return;
      }

      const row = document.createElement("div");

      row.className = "message-row";

      if (senderId === me) {
        row.classList.add("mine");
      }

      const bubble = document.createElement("div");

      bubble.className = "message-bubble";

      const type = message.message_type || "text";

      if (type === "image" && message.media_url) {
        const image = document.createElement("img");

        image.className = "message-image";
        image.src = message.media_url;
        image.alt = "Photo";
        image.loading = "lazy";

        bubble.appendChild(image);

      } else if (type === "voice" && message.media_url) {
        const audio = document.createElement("audio");

        audio.className = "voice-player";
        audio.controls = true;
        audio.preload = "metadata";
        audio.src = message.media_url;

        bubble.appendChild(audio);

      } else {
        const text = document.createElement("div");

        text.textContent = message.content || "";

        bubble.appendChild(text);
      }

      const time = document.createElement("span");

      time.className = "message-time";
      time.textContent = formatTime(message.created_at);

      bubble.appendChild(time);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);

      if (scroll) {
        scrollMessages();
      }
    }

    function scrollMessages() {
      requestAnimationFrame(() => {
        messagesContainer.scrollTop =
          messagesContainer.scrollHeight;
      });
    }

    function sendTextMessage() {
      const content = messageInput.value.trim();

      if (!content || !selectedUser || !socket) {
        return;
      }

      if (content.length > 2000) {
        showToast("Message is too long.");
        return;

      socket.emit("send_message", {

      });

      messageInput.value = "";

        socket.emit("stop_typing", {
          receiverId: selectedUser.id
        });
      }

      messageInput.focus();
    }


    /* =====================================================

    ===================================================== */

    function handleIncomingMessage(message) {
      if (!selectedUser || !currentUser) {
        return;
      }

      const senderId = Number(message.sender_id);
      const receiverId = Number(message.receiver_id);

      const me = Number(currentUser.id);
      const other = Number(selectedUser.id);

      const belongsToCurrentConversation =
        (senderId === me && receiverId === other) ||
        (senderId === other && receiverId === me);

      if (!belongsToCurrentConversation) {
        return;
      }

      /*
        Remove empty-state text if it is present.
      */

      const emptyMessage = messagesContainer.querySelector(
        ".empty-users"
      );

      if (emptyMessage) {
        emptyMessage.remove();
      }

      renderMessage(message, true);
    }

    /* =====================================================
       FILE READER
    ===================================================== */

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
      });

    /* =====================================================
       VOICE RECORDING
    ===================================================== */

    voiceButton.addEventListener("click", async () => {
      if (!selectedUser) {
        showToast("Select a person first.");
        return;
      }

      if (isRecording) {
        stopRecording();
      } else {
        await startRecording();
      }
    });

    async function startRecording() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          showToast("Voice recording is not supported here.");
          return;
        }

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        recordedChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((track) => {
            track.stop();
          });

          await finishRecording();
        };

        mediaRecorder.start();

        isRecording = true;

        voiceButton.classList.add("recording");
        voiceButton.textContent = "■";

        showToast("Recording...");
      } catch (error) {
        console.error(error);
        showToast("Microphone permission is required.");
      }
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        return;
      }

      mediaRecorder.stop();

      isRecording = false;

      voiceButton.classList.remove("recording");
      voiceButton.textContent = "🎙";
    }

    async function finishRecording() {
      if (!selectedUser || !socket || !recordedChunks.length) {
        return;
      }

      try {
        const blob = new Blob(recordedChunks, {
          type: mediaRecorder?.mimeType || "audio/webm"
        });

        if (blob.size > 5 * 1024 * 1024) {
          showToast("Voice message is too large.");
          return;
        }

        const dataUrl = await blobToDataURL(blob);

        showToast("Uploading voice message...");

        const data = await api("/api/media", {
          method: "POST",
          body: JSON.stringify({
            data: dataUrl,
            type: "voice"
          })
        });

        socket.emit("send_media_message", {
          receiverId: selectedUser.id,
          mediaUrl: data.url,
          type: "voice"
        });

        showToast("Voice message sent.");
      } catch (error) {
        console.error(error);
        showToast("Could not send voice message.");
      }
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(blob);
      });
    }

    /* =====================================================
       VIDEO CALL
    ===================================================== */

    videoCallButton.addEventListener(

      startVideoCall

    async function createPeerConnection(targetUserId) {
      peerConnection =
        new RTCPeerConnection(peerConfig);

      peerConnection.onicecandidate = (event) => {
        if (!event.candidate || !socket) {
          return;
        }

        socket.emit("ice_candidate", {
          receiverId: targetUserId,
          candidate: event.candidate
        });
      };

      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (!peerConnection) {
          return;
        }

        const state =
          peerConnection.connectionState;

        if (state === "connected") {
          callStatus.textContent = "Connected";
        }

        if (state === "disconnected") {
          callStatus.textContent = "Disconnected";
        }

        if (state === "failed") {
          callStatus.textContent = "Connection failed.";
        }
      };
    }

    async function startVideoCall() {
      if (!selectedUser || !socket) {
        showToast("Select a person first.");
        return;
      }

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          showToast("Video calling is not supported here.");
          return;
        }

        localStream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
          });

        localVideo.srcObject = localStream;

        await createPeerConnection(selectedUser.id);

        localStream.getTracks().forEach((track) => {
          peerConnection.addTrack(
            track,
            localStream
          );
        });

        const offer =
          await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
          offer
        );

        callTitle.textContent =
          `Calling ${selectedUser.username}`;

        callStatus.textContent =
          "Calling...";

        callScreen.classList.add("show");

        socket.emit("call_user", {
          receiverId: selectedUser.id,
          offer
        });

      } catch (error) {
        console.error(error);
        showToast(
          "Could not start video call. Check your camera and microphone permissions."
        );

        closeCallScreen();
      }
    }


    /* =====================================================
       INCOMING CALL
    ===================================================== */

    function handleIncomingCall(payload) {
      incomingCallerId =
        Number(payload.callerId);

      incomingCallerName =
        payload.callerUsername || "Someone";

      incomingOffer =
        payload.offer;

      incomingCallerNameElement.textContent =
        `${incomingCallerName} is calling you`;

      incomingCall.classList.add("show");
    }


    /* =====================================================
       ACCEPT CALL
    ===================================================== */

    acceptCallButton.addEventListener(
      "click",
      acceptIncomingCall
    );

    async function acceptIncomingCall() {
      if (!incomingCallerId || !incomingOffer) {
        return;
      }

      try {
        incomingCall.classList.remove("show");

        localStream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
          });

        localVideo.srcObject = localStream;

        await createPeerConnection(
          incomingCallerId
        );

        localStream.getTracks().forEach((track) => {
          peerConnection.addTrack(
            track,
            localStream
          );
        });

        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(incomingOffer)
        );

        const answer =
          await peerConnection.createAnswer();

        await peerConnection.setLocalDescription(
          answer
        );

        callTitle.textContent =
          `Video call with ${incomingCallerName}`;

        callStatus.textContent =
          "Connecting...";

        callScreen.classList.add("show");

        socket.emit("call_accepted", {
          callerId: incomingCallerId,
          answer
        });

      } catch (error) {
        console.error(error);
        showToast("Could not accept the call.");
        closeCallScreen();
      }
    }


    /* =====================================================
       REJECT CALL
    ===================================================== */

    rejectCallButton.addEventListener(
      "click",
      () => {
        if (socket && incomingCallerId) {
          socket.emit("call_rejected", {
            callerId: incomingCallerId
          });
        }

        incomingCallerId = null;
        incomingCallerName = "";
        incomingOffer = null;

        incomingCall.classList.remove("show");
      }
    );


    /* =====================================================
       CALL ACCEPTED
    ===================================================== */

    async function handleCallAccepted(payload) {
      if (!peerConnection || !payload?.answer) {
        return;
      }

      try {
        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(payload.answer)
        );

        callStatus.textContent =
          "Connecting...";
      } catch (error) {
        console.error(
          "Could not process call answer:",
          error
        );
      }
    }


    /* =====================================================
       ICE CANDIDATE
    ===================================================== */

    async function handleIceCandidate(payload) {
      if (!peerConnection || !payload?.candidate) {
        return;
      }

      try {
        await peerConnection.addIceCandidate(
          new RTCIceCandidate(payload.candidate)
        );
      } catch (error) {
        console.error(
          "Could not add ICE candidate:",
          error
        );
      }
    }


    /* =====================================================
       END CALL
    ===================================================== */

    endCallButton.addEventListener(
      "click",
      () => {
        if (socket && selectedUser) {
          socket.emit("end_call", {
            receiverId: selectedUser.id
          });
        }

        closeCallScreen();
      }
    );

    function closeCallScreen() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach((track) => {
          track.stop();
        });

        localStream = null;
      }

      remoteVideo.srcObject = null;
      localVideo.srcObject = null;

      callScreen.classList.remove("show");
      incomingCall.classList.remove("show");

      incomingCallerId = null;
      incomingCallerName = "";
      incomingOffer = null;
    }


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    if (token) {
      startApp();
    }

  </script>

</body>
</html>
