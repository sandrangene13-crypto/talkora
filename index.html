<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAVLIK</title>

  <style>
    :root {
      --primary: #176b5b;
      --primary-dark: #0f5145;
      --accent: #31b58c;
      --bg: #f4f7f6;
      --surface: #ffffff;
      --surface-2: #eef3f1;
      --text: #17201e;
      --muted: #71807b;
      --border: #dce5e1;
      --danger: #d64545;
      --online: #31b58c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      color: var(--primary);
      font-size: 38px;
      letter-spacing: 2px;
    }

    .brand p {
      color: var(--muted);
      margin-top: 6px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: var(--surface-2);
      color: var(--muted);
      font-weight: bold;
    }

    .auth-tab.active {
      background: var(--primary);
      color: white;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .auth-error {
      min-height: 18px;
      margin-bottom: 10px;
      color: var(--danger);
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100vh;
      display: none;
    }

    .app.logged-in {
      display: flex;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 370px;
      height: 100%;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .sidebar-brand {
      color: var(--primary);
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .icon-btn:hover {
      background: var(--border);
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 17px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .user-item:hover,
    .user-item.active {
      background: var(--surface-2);
    }

    .avatar {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .empty-users {
      padding: 35px 20px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .chat-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 25px;
    }

    .chat-empty h2 {
      color: var(--text);
      margin-bottom: 8px;
    }

    /* Chat header */

    .chat-header {
      min-height: 70px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      display: none;
    }

    .chat-user {
      flex: 1;
      min-width: 0;
    }

    .chat-user-name {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-user-status {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Call controls */

    .call-buttons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .call-btn {
      height: 38px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: bold;
    }

    .call-btn:hover {
      background: var(--border);
    }

    .call-btn.voice {
      color: var(--primary);
    }

    .call-btn.video {
      color: var(--primary);
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      width: 100%;
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: min(75%, 600px);
      padding: 10px 13px;
      border-radius: 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow-wrap: anywhere;
    }

    .message-row.mine .message-bubble {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      border-bottom-right-radius: 4px;
    }

    .message-row:not(.mine) .message-bubble {
      border-bottom-left-radius: 4px;
    }

    .message-image {
      display: block;
      max-width: 280px;
      max-height: 350px;
      border-radius: 10px;
    }

    .voice-player {
      width: 250px;
      max-width: 100%;
    }

    .message-time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      opacity: 0.7;
      text-align: right;
    }

    .typing {
      height: 24px;
      padding: 0 18px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer {
      padding: 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .composer-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .composer-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 22px;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
    }

    .composer-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 13px;
      font-weight: bold;
    }

    .media-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
      font-size: 11px;
      font-weight: bold;
    }

    .recording {
      background: var(--danger) !important;
      color: white !important;
    }

    .image-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }

    .image-preview.show {
      display: flex;
    }

    .image-preview img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
    }

    .preview-name {
      flex: 1;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       PROFILE
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      font-size: 32px;
      font-weight: bold;
    }

    .profile-info {
      text-align: center;
      line-height: 1.8;
    }

    .logout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--danger);
      color: white;
      font-weight: bold;
    }

    /* =========================
       CALL SCREEN
    ========================= */

    .call-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
      color: white;
    }

    .call-overlay.show {
      display: flex;
    }

    .call-type {
      margin-bottom: 8px;
      font-size: 14px;
      color: #b7c5c0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .call-title {
      margin-bottom: 7px;
      font-size: 24px;
    }

    .call-status {
      margin-bottom: 20px;
      color: #b7c5c0;
    }

    #remoteVideo {
      width: min(900px, 95vw);
      max-height: 65vh;
      display: none;
      background: #000;
      border-radius: 15px;
      object-fit: contain;
    }

    #localVideo {
      position: fixed;
      right: 25px;
      bottom: 100px;
      width: 180px;
      max-width: 30vw;
      display: none;
      background: #000;
      border: 2px solid white;
      border-radius: 12px;
    }

    .voice-call-display {
      width: 160px;
      height: 160px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    .call-actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .call-action {
      min-width: 110px;
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      color: white;
      font-weight: bold;
    }

    .accept-call {
      background: var(--accent);
    }

    .reject-call,
    .end-call {
      background: var(--danger);
    }

    /* =========================
       INCOMING CALL
    ========================= */

    .incoming-call {
      position: fixed;
      left: 50%;
      top: 30px;
      z-index: 2500;
      width: min(400px, calc(100% - 30px));
      padding: 20px;
      transform: translateX(-50%);
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .incoming-call.show {
      display: block;
    }

    .incoming-call-title {
      font-size: 18px;
      font-weight: bold;
    }

    .incoming-call-text {
      margin-top: 7px;
      color: var(--muted);
    }

    .incoming-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 3000;
      padding: 12px 18px;
      transform: translateX(-50%) translateY(100px);
      background: #222;
      color: white;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .chat {
        position: fixed;
        inset: 0;
        z-index: 20;
        transform: translateX(100%);
        transition: transform 0.2s ease;
      }

      .app.chat-open .chat {
        transform: translateX(0);
      }

      .app.chat-open .sidebar {
        display: none;
      }

      .back-btn {
        display: inline-flex;
      }

      .chat-header {
        padding: 9px 10px;
      }

      .call-buttons {
        gap: 4px;
      }

      .call-btn {
        height: 36px;
        padding: 0 8px;
        font-size: 10px;
      }

      .message-bubble {
        max-width: 85%;
      }

      #localVideo {
        right: 12px;
        bottom: 90px;
        width: 130px;
      }

      .auth-card {
        padding: 22px;
      }

      .composer-row {
        gap: 4px;
      }

      .composer-input {
        min-width: 0;
      }

      .media-btn {
        width: 36px;
        height: 36px;
      }

      .send-btn {
        width: 40px;
        height: 40px;
      }
    }

    @media (max-width: 430px) {
      .call-btn {
        width: 34px;
        padding: 0;
        font-size: 9px;
      }

      .chat-user-name {
        font-size: 15px;
      }

      .chat-user-status {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================= -->

  <section id="authScreen" class="auth-screen">
    <div class="auth-card">

      <div class="brand">
        <h1>TAVLIK</h1>
        <p>Private real-time messaging</p>
      </div>

      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active" type="button">
          Login
        </button>

        <button id="registerTab" class="auth-tab" type="button">
          Register
        </button>
      </div>

      <form id="authForm">

        <div id="usernameGroup" class="form-group hidden">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            maxlength="30"
            autocomplete="username"
          >
        </div>

        <div id="emailGroup" class="form-group hidden">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="authEmail">Email</label>
          <input
            id="authEmail"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            minlength="6"
            autocomplete="current-password"
            required
          >
        </div>

        <div id="authError" class="auth-error"></div>

        <button class="primary-btn" type="submit">
          Login
        </button>

      </form>
    </div>
  </section>

  <!-- =========================
       MAIN APP
  ========================= -->

  <main id="app" class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="sidebar-top">

          <div class="sidebar-brand">
            TAVLIK
          </div>

          <div class="header-actions">

            <button
              id="profileBtn"
              class="icon-btn"
              type="button"
              title="Profile"
            >
              Profile
            </button>

            <button
              id="themeBtn"
              class="icon-btn"
              type="button"
              title="Change theme"
            >
              Theme
            </button>

          </div>
        </div>

        <div class="search-box">
          <input
            id="userSearch"
            type="search"
            placeholder="Search users"
            autocomplete="off"
          >
        </div>

      </div>

      <div id="userList" class="user-list">
        <div class="empty-users">
          Search for a user to start a private conversation.
        </div>
      </div>

    </aside>

    <!-- CHAT -->

    <section class="chat">

      <div id="chatEmpty" class="chat-empty">
        <div>
          <h2>Welcome to TAVLIK</h2>
          <p>Select a user to start a private conversation.</p>
        </div>
      </div>

      <div id="chatContent" class="hidden" style="height:100%; display:flex; flex-direction:column;">

        <!-- CHAT HEADER -->

        <header class="chat-header">

          <button
            id="backBtn"
            class="icon-btn back-btn"
            type="button"
            title="Back"
          >
            Back
          </button>

          <div class="avatar" id="chatAvatar">
            U
          </div>

          <div class="chat-user">

            <div id="chatUserName" class="chat-user-name">
              User
            </div>

            <div id="chatUserStatus" class="chat-user-status">
              Offline
            </div>

          </div>

          <!-- CALL BUTTONS -->
          <div class="call-buttons">

            <button
              id="voiceCallBtn"
              class="call-btn voice"
              type="button"
              title="Start voice call"
            >
              Voice Call
            </button>

            <button
              id="videoCallBtn"
              class="call-btn video"
              type="button"
              title="Start video call"
            >
              Video Call
            </button>

          </div>

        </header>

        <!-- MESSAGES -->

        <div id="messages" class="messages"></div>

        <div id="typing" class="typing"></div>

        <!-- COMPOSER -->

        <div class="composer">

          <div id="imagePreview" class="image-preview">
            <img id="previewImage" src="" alt="Selected image">
            <div id="previewName" class="preview-name"></div>

            <button
              id="cancelImageBtn"
              class="icon-btn"
              type="button"
            >
              Remove
            </button>
          </div>

          <div class="composer-row">

            <input
              id="imageInput"
              type="file"
              accept="image/*"
              class="hidden"
            >

            <button
              id="imageBtn"
              class="media-btn"
              type="button"
              title="Send photo"
            >
              Photo
            </button>

            <button
              id="voiceMessageBtn"
              class="media-btn"
              type="button"
              title="Record voice message"
            >
              Voice
            </button>

            <input
              id="messageInput"
              class="composer-input"
              type="text"
              maxlength="2000"
              placeholder="Type a message"
              autocomplete="off"
            >

            <button
              id="sendBtn"
              class="send-btn"
              type="button"
              title="Send message"
            >
              Send
            </button>

          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- =========================
       PROFILE MODAL
  ========================= -->

  <div id="profileModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">

        <h2>Profile</h2>

        <button
          id="closeProfileBtn"
          class="icon-btn"
          type="button"
        >
          Close
        </button>

      </div>

      <div id="profileAvatar" class="profile-avatar">
        U
      </div>

      <div class="profile-info">
        <div id="profileUsername"></div>
        <div id="profileEmail"></div>
      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

  <!-- =========================
       CALL OVERLAY
  ========================= -->

  <div id="callOverlay" class="call-overlay">

    <div id="callType" class="call-type">
      Voice Call
    </div>

    <div id="callTitle" class="call-title">
      Calling
    </div>

    <div id="callStatus" class="call-status">
      Connecting
    </div>

    <div id="voiceCallDisplay" class="voice-call-display">
      Voice Call
    </div>

    <video
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div class="call-actions">

      <button
        id="endCallBtn"
        class="call-action end-call"
        type="button"
      >
        End Call
      </button>

    </div>

  </div>

  <!-- =========================
       INCOMING CALL
  ========================= -->

  <div id="incomingCall" class="incoming-call">

    <div id="incomingCallTitle" class="incoming-call-title">
      Incoming Call
    </div>

    <div id="incomingCallText" class="incoming-call-text">
      Someone is calling you.
    </div>

    <div class="incoming-actions">

      <button
        id="acceptCallBtn"
        class="call-action accept-call"
        type="button"
      >
        Accept
      </button>

      <button
        id="rejectCallBtn"
        class="call-action reject-call"
        type="button"
      >
        Decline
      </button>

    </div>

  </div>

  <!-- =========================
       TOAST
  ========================= -->

  <div id="toast" class="toast"></div>

  <!-- SOCKET.IO -->

  <script src="/socket.io/socket.io.js"></script>

  <script>
    "use strict";

    /* =====================================================
       STATE
    ===================================================== */

    const state = {
      token: localStorage.getItem("tavlik_token"),
      currentUser: null,
      selectedUser: null,
      users: [],
      socket: null,

      mediaRecorder: null,
      recordingChunks: [],

      peerConnection: null,
      localStream: null,
      remoteStream: null,

      currentCall: null,
      incomingCall: null
    };

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const authScreen = document.getElementById("authScreen");
    const app = document.getElementById("app");

    const authForm = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const usernameGroup = document.getElementById("usernameGroup");
    const emailGroup = document.getElementById("emailGroup");

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const authEmailInput = document.getElementById("authEmail");
    const passwordInput = document.getElementById("password");

    const authError = document.getElementById("authError");

    const userSearch = document.getElementById("userSearch");
    const userList = document.getElementById("userList");

    const chatEmpty = document.getElementById("chatEmpty");
    const chatContent = document.getElementById("chatContent");

    const chatAvatar = document.getElementById("chatAvatar");
    const chatUserName = document.getElementById("chatUserName");
    const chatUserStatus = document.getElementById("chatUserStatus");

    const messages = document.getElementById("messages");
    const typing = document.getElementById("typing");

    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    const imageBtn = document.getElementById("imageBtn");
    const imageInput = document.getElementById("imageInput");

    const voiceMessageBtn = document.getElementById("voiceMessageBtn");

    const imagePreview = document.getElementById("imagePreview");
    const previewImage = document.getElementById("previewImage");
    const previewName = document.getElementById("previewName");
    const cancelImageBtn = document.getElementById("cancelImageBtn");

    const voiceCallBtn = document.getElementById("voiceCallBtn");
    const videoCallBtn = document.getElementById("videoCallBtn");

    const profileBtn = document.getElementById("profileBtn");
    const themeBtn = document.getElementById("themeBtn");
    const backBtn = document.getElementById("backBtn");

    const profileModal = document.getElementById("profileModal");
    const closeProfileBtn = document.getElementById("closeProfileBtn");
    const profileAvatar = document.getElementById("profileAvatar");
    const profileUsername = document.getElementById("profileUsername");
    const profileEmail = document.getElementById("profileEmail");
    const logoutBtn = document.getElementById("logoutBtn");

    const callOverlay = document.getElementById("callOverlay");
    const callType = document.getElementById("callType");
    const callTitle = document.getElementById("callTitle");
    const callStatus = document.getElementById("callStatus");

    const voiceCallDisplay = document.getElementById("voiceCallDisplay");

    const remoteVideo = document.getElementById("remoteVideo");
    const localVideo = document.getElementById("localVideo");

    const endCallBtn = document.getElementById("endCallBtn");

    const incomingCall = document.getElementById("incomingCall");
    const incomingCallTitle = document.getElementById("incomingCallTitle");
    const incomingCallText = document.getElementById("incomingCallText");

    const acceptCallBtn = document.getElementById("acceptCallBtn");
    const rejectCallBtn = document.getElementById("rejectCallBtn");

    const toast = document.getElementById("toast");

    /* =====================================================
       AUTH MODE
    ===================================================== */

    let authMode = "login";

    function setAuthMode(mode) {
      authMode = mode;

      authError.textContent = "";

      if (mode === "login") {
        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        usernameGroup.classList.add("hidden");
        emailGroup.classList.add("hidden");

        authForm.querySelector(".primary-btn").textContent = "Login";

        usernameInput.required = false;
        emailInput.required = false;
        authEmailInput.required = true;

        passwordInput.autocomplete = "current-password";
      } else {
        loginTab.classList.remove("active");
        registerTab.classList.add("active");

        usernameGroup.classList.remove("hidden");
        emailGroup.classList.remove("hidden");

        authForm.querySelector(".primary-btn").textContent = "Create Account";

        usernameInput.required = true;
        emailInput.required = true;
        authEmailInput.required = false;

        passwordInput.autocomplete = "new-password";
      }
    }

    loginTab.addEventListener("click", () => setAuthMode("login"));
    registerTab.addEventListener("click", () => setAuthMode("register"));

    /* =====================================================
       API
    ===================================================== */

    async function api(url, options = {}) {
      const headers = {
        ...(options.headers || {})
      };

      if (state.token) {
        headers.Authorization = `Bearer ${state.token}`;
      }

      if (
        options.body &&
        typeof options.body === "object" &&
        !(options.body instanceof FormData)
      ) {
        headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(options.body);
      }

      const response = await fetch(url, {
        ...options,
        headers
      });

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        throw new Error(
          data?.error ||
          data?.message ||
          "Request failed"
        );
      }

      return data;
    }

    /* =====================================================
       AUTH
    ===================================================== */

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      authError.textContent = "";

      try {
        if (authMode === "login") {
          const data = await api("/api/auth/login", {
            method: "POST",
            body: {
              email: authEmailInput.value.trim(),
              password: passwordInput.value
            }
          });

          state.token = data.token;

          localStorage.setItem(
            "tavlik_token",
            state.token
          );

          await startApplication();
        } else {
          const data = await api("/api/auth/register", {
            method: "POST",
            body: {
              username: usernameInput.value.trim(),
              email: emailInput.value.trim(),
              password: passwordInput.value
            }
          });

          state.token = data.token;

          localStorage.setItem(
            "tavlik_token",
            state.token
          );

          await startApplication();
        }
      } catch (error) {
        authError.textContent = error.message;
      }
    });

    /* =====================================================
       START APP
    ===================================================== */

    async function startApplication() {
      try {
        const data = await api("/api/me");

        state.currentUser =
          data.user ||
          data;

        authScreen.style.display = "none";
        app.classList.add("logged-in");

        updateProfile();

        connectSocket();

        await loadUsers();
      } catch (error) {
        localStorage.removeItem("tavlik_token");
        state.token = null;
        authScreen.style.display = "flex";
        app.classList.remove("logged-in");
        authError.textContent = "Please login again.";
      }
    }

    /* =====================================================
       USERS
    ===================================================== */

    async function loadUsers(search = "") {
      try {
        const query =
          encodeURIComponent(search.trim());

        const data = await api(
          `/api/users/search?q=${query}`
        );

        state.users =
          data.users ||
          data ||
          [];

        renderUsers();
      } catch (error) {
        userList.innerHTML = `
          <div class="empty-users">
            Could not load users.
          </div>
        `;
      }
    }

    function renderUsers() {
      if (!state.users.length) {
        userList.innerHTML = `
          <div class="empty-users">
            No users found.
          </div>
        `;

        return;
      }

      userList.innerHTML = "";

      state.users.forEach((user) => {
        if (
          state.currentUser &&
          Number(user.id) === Number(state.currentUser.id)
        ) {
          return;
        }

        const item =
          document.createElement("div");

        item.className = "user-item";

        if (
          state.selectedUser &&
          Number(state.selectedUser.id) === Number(user.id)
        ) {
          item.classList.add("active");
        }

        const avatar =
          document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
          getInitial(user.username);

        const info =
          document.createElement("div");

        info.className = "user-info";

        const name =
          document.createElement("div");

        name.className = "user-name";

        name.textContent =
          user.username;

        const subtitle =
          document.createElement("div");

        subtitle.className =
          "user-subtitle";

        subtitle.textContent =
          isUserOnline(user.id)
            ? "Online"
            : "Offline";

        info.appendChild(name);
        info.appendChild(subtitle);

        item.appendChild(avatar);
        item.appendChild(info);

        item.addEventListener("click", () => {
          selectUser(user);
        });

        userList.appendChild(item);
      });
    }

    function getInitial(name) {
      if (!name) return "U";

      return name
        .trim()
        .charAt(0)
        .toUpperCase();
    }

    userSearch.addEventListener(
      "input",
      debounce(() => {
        loadUsers(userSearch.value);
      }, 300)
    );

    /* =====================================================
       SELECT USER
    ===================================================== */

    async function selectUser(user) {
      state.selectedUser = {
        id: Number(user.id),
        username: user.username
      };

      chatEmpty.classList.add("hidden");
      chatContent.classList.remove("hidden");

      app.classList.add("chat-open");

      chatUserName.textContent =
        user.username;

      chatAvatar.textContent =
        getInitial(user.username);

      updateChatStatus();

      renderUsers();

      await loadMessages(user.id);
    }

    backBtn.addEventListener("click", () => {
      app.classList.remove("chat-open");
      state.selectedUser = null;
    });

    /* =====================================================
       MESSAGES
    ===================================================== */

    async function loadMessages(userId) {
      messages.innerHTML = "";

      try {
        const data = await api(
          `/api/messages/${userId}`
        );

        const list =
          data.messages ||
          data ||
          [];

        list.forEach((message) => {
          if (isMessageForCurrentChat(message)) {
            renderMessage(message);
          }
        });

        scrollMessages();
      } catch {
        showToast("Could not load messages.");
      }
    }

    function isMessageForCurrentChat(message) {
      if (
        !state.currentUser ||
        !state.selectedUser
      ) {
        return false;
      }

      const me =
        Number(state.currentUser.id);

      const other =
        Number(state.selectedUser.id);

      const sender =
        Number(message.sender_id);

      const receiver =
        Number(message.receiver_id);

      return (
        (sender === me && receiver === other) ||
        (sender === other && receiver === me)
      );
    }

    function renderMessage(message) {
      if (!isMessageForCurrentChat(message)) {
        return;
      }

      const row =
        document.createElement("div");

      const mine =
        Number(message.sender_id) ===
        Number(state.currentUser.id);

      row.className =
        `message-row${mine ? " mine" : ""}`;

      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble";

      const type =
        message.message_type ||
        message.type ||
        "text";

      if (
        type === "image" &&
        message.media_url
      ) {
        const img =
          document.createElement("img");

        img.className =
          "message-image";

        img.src =
          message.media_url;

        img.alt =
          "Photo message";

        img.loading = "lazy";

        bubble.appendChild(img);
      } else if (
        type === "audio" &&
        message.media_url
      ) {
        const audio =
          document.createElement("audio");

        audio.className =
          "voice-player";

        audio.controls = true;

        audio.src =
          message.media_url;

        bubble.appendChild(audio);
      } else {
        const text =
          document.createElement("div");

        text.textContent =
          message.content || "";

        bubble.appendChild(text);
      }

      if (message.created_at) {
        const time =
          document.createElement("span");

        time.className =
          "message-time";

        time.textContent =
          formatTime(message.created_at);

        bubble.appendChild(time);
      }

      row.appendChild(bubble);

      messages.appendChild(row);
    }

    function formatTime(value) {
      const date =
        new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function scrollMessages() {
      messages.scrollTop =
        messages.scrollHeight;
    }

    /* =====================================================
       SEND TEXT
    ===================================================== */

    async function sendTextMessage() {
      const content =
        messageInput.value.trim();

      if (!content) return;

      if (!state.selectedUser) {
        showToast("Select a user first.");
        return;
      }

      if (!state.socket) {
        showToast("Not connected to server.");
        return;
      }

      state.socket.emit(
        "send_message",
        {
          receiverId:
            Number(state.selectedUser.id),

          content
        }
      );

      messageInput.value = "";
      typing.textContent = "";
    }

    sendBtn.addEventListener(
      "click",
      sendTextMessage
    );

    messageInput.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendTextMessage();
        }
      }
    );

    /* =====================================================
       TYPING
    ===================================================== */

    let typingTimer = null;

    messageInput.addEventListener(
      "input",
      () => {
        if (
          !state.socket ||
          !state.selectedUser
        ) {
          return;
        }

        state.socket.emit(
          "typing",
          {
            receiverId:
              Number(state.selectedUser.id)
          }
        );

        clearTimeout(typingTimer);

        typingTimer =
          setTimeout(() => {
            state.socket.emit(
              "stop_typing",
              {
                receiverId:
                  Number(state.selectedUser.id)
              }
            );
          }, 700);
      }
    );

    /* =====================================================
       PHOTO MESSAGES
    ===================================================== */

    imageBtn.addEventListener(
      "click",
      () => {
        if (!state.selectedUser) {
          showToast("Select a user first.");
          return;
        }

        imageInput.click();
      }
    );

    imageInput.addEventListener(
      "change",
      async () => {
        const file =
          imageInput.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
          showToast("Please select an image.");
          imageInput.value = "";
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          showToast("Image must be 5 MB or smaller.");
          imageInput.value = "";
          return;
        }

        previewImage.src =
          URL.createObjectURL(file);

        previewName.textContent =
          file.name;

        imagePreview.classList.add("show");

        try {
          const dataUrl =
            await fileToDataURL(file);

          const uploaded =
            await api("/api/media", {
              method: "POST",
              body: {
                type: "image",
                data: dataUrl
              }
            });

          const mediaUrl =
            uploaded.url ||
            uploaded.media_url;

          if (!mediaUrl) {
            throw new Error(
              "Upload did not return a media URL."
            );
          }

          state.socket.emit(
            "send_media_message",
            {
              receiverId:
                Number(state.selectedUser.id),

              mediaType: "image",

              mediaUrl
            }
          );

          clearImagePreview();
        } catch (error) {
          showToast(error.message);
        }
      }
    );

    function clearImagePreview() {
      imagePreview.classList.remove("show");
      previewImage.src = "";
      previewName.textContent = "";
      imageInput.value = "";
    }

    cancelImageBtn.addEventListener(
      "click",
      clearImagePreview
    );

    /* =====================================================
       VOICE MESSAGES
    ===================================================== */

    voiceMessageBtn.addEventListener(
      "click",
      toggleVoiceRecording
    );

    async function toggleVoiceRecording() {
      if (state.mediaRecorder) {
        stopVoiceRecording();
        return;
      }

      if (!state.selectedUser) {
        showToast("Select a user first.");
        return;
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        showToast(
          "Voice recording is not supported here."
        );
        return;
      }

      try {
        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        state.recordingChunks = [];

        state.mediaRecorder =
          new MediaRecorder(stream);

        state.mediaRecorder.ondataavailable =
          (event) => {
            if (event.data.size > 0) {
              state.recordingChunks.push(
                event.data
              );
            }
          };

        state.mediaRecorder.onstop =
          async () => {
            const blob =
              new Blob(
                state.recordingChunks,
                {
                  type:
                    state.mediaRecorder.mimeType ||
                    "audio/webm"
                }
              );

            stream
              .getTracks()
              .forEach((track) => track.stop());

            state.mediaRecorder = null;

            voiceMessageBtn.classList.remove(
              "recording"
            );

            voiceMessageBtn.textContent =
              "Voice";

            await uploadVoiceMessage(blob);
          };

        state.mediaRecorder.start();

        voiceMessageBtn.classList.add(
          "recording"
        );

        voiceMessageBtn.textContent =
          "Stop";

        showToast("Recording started.");
      } catch (error) {
        showToast(
          "Microphone permission was not granted."
        );
      }
    }

    function stopVoiceRecording() {
      if (
        state.mediaRecorder &&
        state.mediaRecorder.state !== "inactive"
      ) {
        state.mediaRecorder.stop();
      }
    }

    async function uploadVoiceMessage(blob) {
      if (!state.selectedUser) return;

      if (blob.size > 5 * 1024 * 1024) {
        showToast(
          "Voice message is too large."
        );
        return;
      }

      try {
        const dataUrl =
          await blobToDataURL(blob);

        const uploaded =
          await api("/api/media", {
            method: "POST",
            body: {
              type: "audio",
              data: dataUrl
            }
          });

        const mediaUrl =
          uploaded.url ||
          uploaded.media_url;

        if (!mediaUrl) {
          throw new Error(
            "Voice upload failed."
          );
        }

        state.socket.emit(
          "send_media_message",
          {
            receiverId:
              Number(state.selectedUser.id),

            mediaType: "audio",

            mediaUrl
          }
        );
      } catch (error) {
        showToast(error.message);
      }
    }

    /* =====================================================
       SOCKET
    ===================================================== */

    function connectSocket() {
      if (!state.token) return;

      if (state.socket) {
        state.socket.disconnect();
      }

      state.socket =
        io({
          auth: {
            token: state.token
          }
        });

      state.socket.on(
        "connect",
        () => {
          updateChatStatus();
          loadUsers(userSearch.value);
        }
      );

      state.socket.on(
        "disconnect",
        () => {
          updateChatStatus();
        }
      );

      state.socket.on(
        "connect_error",
        () => {
          showToast(
            "Could not connect to server."
          );
        }
      );

      state.socket.on(
        "new_message",
        (message) => {
          if (
            isMessageForCurrentChat(message)
          ) {
            renderMessage(message);
            scrollMessages();
          }
        }
      );

      state.socket.on(
        "message",
        (message) => {
          if (
            isMessageForCurrentChat(message)
          ) {
            renderMessage(message);
            scrollMessages();
          }
        }
      );

      state.socket.on(
        "user_online",
        () => {
          loadUsers(userSearch.value);
          updateChatStatus();
        }
      );

      state.socket.on(
        "user_offline",
        () => {
          loadUsers(userSearch.value);
          updateChatStatus();
        }
      );

      state.socket.on(
        "typing",
        ({ senderId }) => {
          if (
            state.selectedUser &&
            Number(senderId) ===
              Number(state.selectedUser.id)
          ) {
            typing.textContent =
              `${state.selectedUser.username} is typing...`;
          }
        }
      );

      state.socket.on(
        "stop_typing",
        ({ senderId }) => {
          if (
            state.selectedUser &&
            Number(senderId) ===
              Number(state.selectedUser.id)
          ) {
            typing.textContent = "";
          }
        }
      );

      /* Incoming voice/video call */

      state.socket.on(
        "incoming_call",
        (data) => {
          handleIncomingCall(data);
        }
      );

      /* Call accepted */

      state.socket.on(
        "call_accepted",
        async (data) => {
          if (
            !state.currentCall ||
            Number(data.fromUserId) !==
              Number(state.currentCall.userId)
          ) {
            return;
          }

          try {
            showCallScreen(
              state.currentCall.type,
              state.currentCall.username,
              "Connected"
            );

            const offer =
              await createOffer();

            state.socket.emit(
              "call_user",
              {
                userId:
                  Number(state.currentCall.userId),

                offer,

                callType:
                  state.currentCall.type
              }
            );
          } catch (error) {
            endCall();
          }
        }
      );

      /* ICE candidate */

      state.socket.on(
        "ice_candidate",
        async (data) => {
          if (
            !state.peerConnection ||
            !data.candidate
          ) {
            return;
          }

          try {
            await state.peerConnection.addIceCandidate(
              data.candidate
            );
          } catch {}
        }
      );

      /* WebRTC offer */

      state.socket.on(
        "call_offer",
        async (data) => {
          try {
            await handleOffer(data);
          } catch {
            endCall();
          }
        }
      );

      /* Rejected */

      state.socket.on(
        "call_rejected",
        () => {
          showToast("Call declined.");
          endCall(false);
        }
      );

      /* Ended */

      state.socket.on(
        "end_call",
        () => {
          endCall(false);
        }
      );
    }

    /* =====================================================
       ONLINE STATUS
    ===================================================== */

    function isUserOnline(userId) {
      /*
       * The server may send online status through
       * socket events. If the API later provides
       * an online property, this also supports it.
       */

      const user =
        state.users.find(
          (item) =>
            Number(item.id) ===
            Number(userId)
        );

      return Boolean(
        user &&
        (
          user.online === true ||
          user.is_online === true
        )
      );
    }

    function updateChatStatus() {
      if (!state.selectedUser) return;

      if (
        state.socket &&
        state.socket.connected
      ) {
        chatUserStatus.textContent =
          isUserOnline(
            state.selectedUser.id
          )
            ? "Online"
            : "Available";
      } else {
        chatUserStatus.textContent =
          "Connecting";
      }
    }

    /* =====================================================
       VOICE / VIDEO CALLS
    ===================================================== */

    voiceCallBtn.addEventListener(
      "click",
      () => startCall("voice")
    );

    videoCallBtn.addEventListener(
      "click",
      () => startCall("video")
    );

    async function startCall(type) {
      if (!state.selectedUser) {
        showToast("Select a user first.");
        return;
      }

      if (
        !state.socket ||
        !state.socket.connected
      ) {
        showToast(
          "Not connected to server."
        );
        return;
      }

      try {
        await prepareLocalMedia(type);

        state.currentCall = {
          type,
          userId:
            Number(state.selectedUser.id),
          username:
            state.selectedUser.username,
          caller: true
        };

        showCallScreen(
          type,
          state.selectedUser.username,
          "Calling"
        );

        state.socket.emit(
          "call_user",
          {
            userId:
              Number(state.selectedUser.id),

            callType: type
          }
        );
      } catch {
        cleanupCallMedia();

        showToast(
          type === "video"
            ? "Camera or microphone permission was not granted."
            : "Microphone permission was not granted."
        );
      }
    }

    async function prepareLocalMedia(type) {
      cleanupCallMedia();

      const constraints =
        type === "video"
          ? {
              audio: true,
              video: true
            }
          : {
              audio: true,
              video: false
            };

      state.localStream =
        await navigator.mediaDevices.getUserMedia(
          constraints
        );

      localVideo.srcObject =
        state.localStream;

      if (type === "video") {
        localVideo.style.display =
          "block";
      } else {
        localVideo.style.display =
          "none";
      }
    }

    function showCallScreen(
      type,
      username,
      status
    ) {
      callOverlay.classList.add("show");

      callType.textContent =
        type === "video"
          ? "Video Call"
          : "Voice Call";

      callTitle.textContent =
        username || "Call";

      callStatus.textContent =
        status;

      if (type === "video") {
        remoteVideo.style.display =
          "block";

        voiceCallDisplay.style.display =
          "none";

        localVideo.style.display =
          "block";
      } else {
        remoteVideo.style.display =
          "none";

        localVideo.style.display =
          "none";

        voiceCallDisplay.style.display =
          "flex";
      }
    }

    /* =====================================================
       INCOMING CALL
    ===================================================== */

    function handleIncomingCall(data) {
      if (!data) return;

      state.incomingCall = data;

      const type =
        data.callType === "video"
          ? "video"
          : "voice";

      const username =
        data.username ||
        data.fromUsername ||
        "User";

      incomingCallTitle.textContent =
        type === "video"
          ? "Incoming Video Call"
          : "Incoming Voice Call";

      incomingCallText.textContent =
        `${username} is calling you.`;

      incomingCall.classList.add(
        "show"
      );
    }

    acceptCallBtn.addEventListener(
      "click",
      async () => {
        if (!state.incomingCall) {
          return;
        }

        const call =
          state.incomingCall;

        incomingCall.classList.remove(
          "show"
        );

        try {
          const type =
            call.callType === "video"
              ? "video"
              : "voice";

          await prepareLocalMedia(type);

          state.currentCall = {
            type,

            userId:
              Number(
                call.fromUserId ||
                call.userId
              ),

            username:
              call.username ||
              call.fromUsername ||
              "User",

            caller: false
          };

          showCallScreen(
            type,
            state.currentCall.username,
            "Connecting"
          );

          state.socket.emit(
            "call_accepted",
            {
              toUserId:
                Number(
                  call.fromUserId ||
                  call.userId
                ),

              callType: type
            }
          );

          if (call.offer) {
            await handleOffer(call);
          }
        } catch {
          endCall();
        }

        state.incomingCall = null;
      }
    );

    rejectCallBtn.addEventListener(
      "click",
      () => {
        if (state.incomingCall) {
          state.socket.emit(
            "call_rejected",
            {
              toUserId:
                Number(
                  state.incomingCall.fromUserId ||
                  state.incomingCall.userId
                )
            }
          );
        }

        incomingCall.classList.remove(
          "show"
        );

        state.incomingCall = null;
      }
    );

    /* =====================================================
       WEBRTC
    ===================================================== */

    function createPeerConnection() {
      const configuration = {
        iceServers: [
          {
            urls:
              "stun:stun.l.google.com:19302"
          }
        ]
      };

      const pc =
        new RTCPeerConnection(
          configuration
        );

      state.peerConnection = pc;

      state.remoteStream =
        new MediaStream();

      remoteVideo.srcObject =
        state.remoteStream;

      if (state.localStream) {
        state.localStream
          .getTracks()
          .forEach((track) => {
            pc.addTrack(
              track,
              state.localStream
            );
          });
      }

      pc.ontrack =
        (event) => {
          event.streams[0]
            .getTracks()
            .forEach((track) => {
              state.remoteStream.addTrack(
                track
              );
            });

          remoteVideo.srcObject =
            state.remoteStream;

          callStatus.textContent =
            "Connected";
        };

      pc.onicecandidate =
        (event) => {
          if (
            event.candidate &&
            state.currentCall
          ) {
            state.socket.emit(
              "ice_candidate",
              {
                toUserId:
                  Number(
                    state.currentCall.userId
                  ),

                candidate:
                  event.candidate
              }
            );
          }
        };

      pc.onconnectionstatechange =
        () => {
          if (
            pc.connectionState ===
              "connected"
          ) {
            callStatus.textContent =
              "Connected";
          }

          if (
            pc.connectionState ===
              "failed"
          ) {
            endCall();
          }

          if (
            pc.connectionState ===
              "disconnected"
          ) {
            callStatus.textContent =
              "Connection interrupted";
          }
        };

      return pc;
    }

    async function createOffer() {
      const pc =
        createPeerConnection();

      const offer =
        await pc.createOffer();

      await pc.setLocalDescription(
        offer
      );

      return offer;
    }

    async function handleOffer(data) {
      if (!state.currentCall) {
        return;
      }

      const pc =
        createPeerConnection();

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      state.socket.emit(
        "call_user",
        {
          userId:
            Number(
              data.fromUserId ||
              data.userId ||
              state.currentCall.userId
            ),

          answer,

          callType:
            state.currentCall.type
        }
      );
    }

    /* =====================================================
       END CALL
    ===================================================== */

    endCallBtn.addEventListener(
      "click",
      () => endCall(true)
    );

    function endCall(notify = true) {
      if (
        notify &&
        state.socket &&
        state.currentCall
      ) {
        state.socket.emit(
          "end_call",
          {
            toUserId:
              Number(
                state.currentCall.userId
              )
          }
        );
      }

      if (state.peerConnection) {
        try {
          state.peerConnection.close();
        } catch {}

        state.peerConnection = null;
      }

      cleanupCallMedia();

      state.currentCall = null;

      remoteVideo.srcObject = null;
      localVideo.srcObject = null;

      callOverlay.classList.remove(
        "show"
      );

      remoteVideo.style.display =
        "none";

      localVideo.style.display =
        "none";

      voiceCallDisplay.style.display =
        "none";

      incomingCall.classList.remove(
        "show"
      );
    }

    function cleanupCallMedia() {
      if (state.localStream) {
        state.localStream
          .getTracks()
          .forEach((track) => {
            track.stop();
          });

        state.localStream = null;
      }
    }

    /* =====================================================
       PROFILE
    ===================================================== */

    profileBtn.addEventListener(
      "click",
      () => {
        updateProfile();

        profileModal.classList.remove(
          "hidden"
        );
      }
    );

    closeProfileBtn.addEventListener(
      "click",
      () => {
        profileModal.classList.add(
          "hidden"
        );
      }
    );

    profileModal.addEventListener(
      "click",
      (event) => {
        if (
          event.target === profileModal
        ) {
          profileModal.classList.add(
            "hidden"
          );
        }
      }
    );

    function updateProfile() {
      if (!state.currentUser) return;

      const name =
        state.currentUser.username ||
        "User";

      profileAvatar.textContent =
        getInitial(name);

      profileUsername.textContent =
        name;

      profileEmail.textContent =
        state.currentUser.email ||
        "";
    }

    /* =====================================================
       LOGOUT
    ===================================================== */

    logoutBtn.addEventListener(
      "click",
      () => {
        endCall(false);

        if (state.socket) {
          state.socket.disconnect();
          state.socket = null;
        }

        localStorage.removeItem(
          "tavlik_token"
        );

        state.token = null;
        state.currentUser = null;
        state.selectedUser = null;

        app.classList.remove(
          "logged-in",
          "chat-open"
        );

        profileModal.classList.add(
          "hidden"
        );

        chatContent.classList.add(
          "hidden"
        );

        chatEmpty.classList.remove(
          "hidden"
        );

        authScreen.style.display =
          "flex";

        authForm.reset();

        setAuthMode("login");
      }
    );

    /* =====================================================
       THEME
    ===================================================== */

    themeBtn.addEventListener(
      "click",
      () => {
        document.body.classList.toggle(
          "dark"
        );

        localStorage.setItem(
          "tavlik_theme",
          document.body.classList.contains(
            "dark"
          )
            ? "dark"
            : "light"
        );
      }
    );

    function loadTheme() {
      const theme =
        localStorage.getItem(
          "tavlik_theme"
        );

      if (theme === "dark") {
        document.body.classList.add(
          "dark"
        );
      }
    }

    /* =====================================================
       HELPERS
    ===================================================== */

    function fileToDataURL(file) {
      return new Promise(
        (resolve, reject) => {
          const reader =
            new FileReader();

          reader.onload =
            () => resolve(
              reader.result
            );

          reader.onerror =
            reject;

          reader.readAsDataURL(file);
        }
      );
    }

    function blobToDataURL(blob) {
      return new Promise(
        (resolve, reject) => {
          const reader =
            new FileReader();

          reader.onload =
            () => resolve(
              reader.result
            );

          reader.onerror =
            reject;

          reader.readAsDataURL(blob);
        }
      );
    }

    function debounce(
      callback,
      delay
    ) {
      let timer;

      return (...args) => {
        clearTimeout(timer);

        timer =
          setTimeout(
            () => callback(...args),
            delay
          );
      };
    }

    let toastTimer = null;

    function showToast(message) {
      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(() => {
          toast.classList.remove(
            "show"
          );
        }, 2500);
    }

    /* =====================================================
       START
    ===================================================== */

    loadTheme();
    setAuthMode("login");

    if (state.token) {
      startApplication();
    }
  </script>

</body>
</html>
